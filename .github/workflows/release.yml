name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release (ignores commit message check)'
        required: false
        type: boolean
        default: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if commit message contains !release
        id: check
        run: |
          # Check if manually triggered with force_release
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ github.event.inputs.force_release }}" == "true" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Manual release triggered"
          elif [[ "${{ github.event.head_commit.message }}" == *"!release"* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Release triggered by commit message"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No release triggered"
          fi

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Detect prerelease
        id: prerelease
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if echo "$VERSION" | grep -qiE '(alpha|beta|rc|dev)'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Detected prerelease version: $VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Detected stable version: $VERSION"
          fi

  build-linux:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 wget

      - name: Build AppImage
        run: |
          cd packaging
          chmod +x build-appimage.sh
          ./build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLine-Linux-AppImage
          path: BLine-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Build Windows executable
        run: |
          cd packaging
          .\build-windows.ps1

      - name: Create portable ZIP
        run: |
          cd packaging
          .\create-portable.ps1

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Create installer
        run: |
          cd packaging
          .\create-installer.ps1

      - name: ZIP the executable folder
        run: |
          cd packaging\dist
          Compress-Archive -Path BLine -DestinationPath ..\..\BLine-${{ needs.check-release.outputs.version }}-Windows-Executable.zip

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BLine-Windows-Portable
          path: BLine-*-Windows-Portable.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BLine-Windows-Installer
          path: packaging/BLine-*-Setup.exe
          if-no-files-found: error

      - name: Upload Windows executable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BLine-Windows-Executable
          path: BLine-*-Windows-Executable.zip
          if-no-files-found: error

  build-macos:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build DMG
        run: |
          cd packaging
          chmod +x build-dmg.sh
          ./build-dmg.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLine-macOS-DMG
          path: BLine-*-macOS-arm64.dmg
          if-no-files-found: error

  create-release:
    needs: [check-release, build-linux, build-windows, build-macos]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: BLine-Linux-AppImage
          path: ./artifacts

      - name: Download Windows portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: BLine-Windows-Portable
          path: ./artifacts

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: BLine-Windows-Installer
          path: ./artifacts

      - name: Download Windows executable ZIP
        uses: actions/download-artifact@v4
        with:
          name: BLine-Windows-Executable
          path: ./artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: BLine-macOS-DMG
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          name: BLine v${{ needs.check-release.outputs.version }}${{ needs.check-release.outputs.is_prerelease == 'true' && ' (Preview)' || '' }}
          body: |
            ## BLine v${{ needs.check-release.outputs.version }}
            ${{ needs.check-release.outputs.is_prerelease == 'true' && '> ⚠️ **This is a pre-release preview.** It may contain bugs or incomplete features. Use in production at your own risk.' || '' }}

            ### Downloads

            **macOS (Apple Silicon):**
            - `BLine-${{ needs.check-release.outputs.version }}-macOS-arm64.dmg` - Disk image

            **Linux:**
            - `BLine-x86_64.AppImage` - Single portable file

            **Windows:**
            - `BLine-${{ needs.check-release.outputs.version }}-Setup.exe` - Installer (recommended)
            - `BLine-${{ needs.check-release.outputs.version }}-Windows-Portable.zip` - Portable ZIP (no install)
            - `BLine-${{ needs.check-release.outputs.version }}-Windows-Executable.zip` - Executable folder

            ### Installation

            **macOS:**
            1. Download `BLine-${{ needs.check-release.outputs.version }}-macOS-arm64.dmg`
            2. Open the DMG and drag BLine.app to Applications
            3. Launch from Applications

            **Linux:**
            1. Download `BLine-x86_64.AppImage`
            2. Make it executable: `chmod +x BLine-x86_64.AppImage`
            3. Run: `./BLine-x86_64.AppImage`

            **Windows (Installer):**
            1. Download and run `BLine-${{ needs.check-release.outputs.version }}-Setup.exe`
            2. Follow the installation wizard
            3. Launch from Start Menu

            **Windows (Portable):**
            1. Download and extract the portable ZIP
            2. Run `BLine.exe`
            3. No installation required!

            ---
            *Built automatically by GitHub Actions*
          files: |
            artifacts/*
          draft: false
          prerelease: ${{ needs.check-release.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
